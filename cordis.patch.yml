# The `autoresearch` agent preset: the shipped `standard` coding agent, adapted into a
# DOMAIN-NEUTRAL research workbench. What it changes relative to `standard`:
#   - `persona` carries a resident research discipline (three-way typing, no
#     unfalsifiable wording, no memory-based citations, read-before-write) plus
#     routing to ten research-discipline skills.
#   - `persona` deliberately has NO `suffix`. The kernel registered `cwd` as a prompt variable only
#     through 0.2.0; from 0.2.1 its registry holds `provider` and `model` alone, and prompt
#     assembly interpolates strictly - any other name THROWS, which fails every turn before the
#     request is made while the preset still mounts and stays on the new-session roster. The
#     working directory is a REQUIRED runtime context now (`Current working directory: "<path>".`,
#     refreshed at each assembly and kept current across `cd`), so dropping the suffix loses
#     nothing. Do not put an unregistered `{{name}}` back: the self-test checks every placeholder
#     against the kernel's registry. See #47 of docs/01_decisions.md.
#   - `present` and `tool-ralph` rows are dropped (not needed for research work).
#   - `skill-filesystem` is REQUIRED here: without it, the user skill directory and `<workspace>/.agents/skills/` are not loaded — the disciplines of THIS preset are shipped and registered by the `autoresearch-skills` row, while this row still supplies project-level ones.
#   - NO MCP server is mounted. Both external channels ship as command-line helpers named by the
#     disciplines (tools/arxiv.mjs and tools/zotero-*.mjs), which cost nothing on a request that does
#     not use them. The two rows they replaced cost 21,551 tokens of prompt on EVERY request for 54
#     tools, of which the disciplines called a handful; the DSH MCP client has no field that filters
#     a server's tool list, so the only lever was not mounting the row. See #29 and #31 of
#     docs/01_decisions.md, and do not add either row back - the preset's own self-test fails if one
#     reappears.
#   - `isolation.js` masks the profile's OTHER global tools (univer, config-manager,
#     code-review, ...), keeping only the ones this preset deliberately retains.
# Design record: ../docs/00_overview.md (what it is) and ../docs/01_decisions.md (why).

- insert:
    - id: preset-autoresearch
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: autoresearch
        name: Autoresearch
        description: Domain-neutral research workbench — a resident evidence-typing discipline plus on-demand disciplines covering the whole research loop (scoping → literature → adoption → challenge → synthesis → runs → settlement), with keep-list tool isolation.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a research agent powered by the {{model}} model.

                ## Research discipline (always in force)

                1. **Three-way typing.** Every output must let the reader separate **fact** (evidence-backed, reproducible), **inference** (has a reasoning chain but is unverified), and **[exploratory]** (unverified and undecided). Never present an inference or an exploratory idea as a fact.
                2. **No unfalsifiable wording.** Never write "study further", "explore in more depth", "of great significance", "promising", "many studies show", or "worth discussing". Replace them with statements that can be tested.
                3. **No citations from memory.** Literature, data, and prior conclusions must come from something actually read in this session, with a path or a retrievable identifier. If the source cannot be recalled, write "unverified".
                4. **Read before writing.** Before adding or changing any file, do a read-only survey first. If the workspace already has a directory convention, a document authority hierarchy, or an archiving rule, **follow it** — do not create a parallel structure and do not rename existing directories.
                5. **Three kinds of "nothing", and what an absence claim must carry.** Distinguish "not searched", "searched and confirmed absent", and "not yet searched", and never conflate them. A claim of "confirmed absent" must name the targeted check (the object's own title, author or identifier), the scope searched, and the number of hits: a keyword search that returned nothing is not evidence of absence.
                6. **Decisions belong to the user.** When a choice is the user's, confirm it item by item with ask_user_question; never decide for them. Scientific judgement and final rulings belong to the user.
                7. **Never silently change an agreed contract.** When existing content is wrong or needs revision, record "revision + reason" or request a ruling; do not overwrite.
                8. **Do not exceed your mandate.** Do only what was asked. Rewriting someone else's claim, deleting existing artifacts, or changing a study's conclusions is not within your authority.
                9. **A subagent report is evidence, not a fact.** A delegated child's conclusion stays attributed and `[unverified]` until you read its artifact yourself. Require a report file plus the exact command — never a long inline report, whose middle is truncated silently.
                10. **A consequence of the construction is not a measurement.** Before reporting a number as a finding, name the rule it follows from. If it follows from how the object was built — a fixed step size, an identity that holds by definition, a bound that cannot be otherwise — report it as a property of the definition, not as a result, and build no conclusion on it.
                11. **Re-anchor to the request.** Track the items the user actually asked for, each marked delivered or outstanding. Before opening a new branch, state in one line which outstanding item it serves. After three consecutive sub-tasks that touched none of them, say so and offer to return to them before continuing.

                ## Which skill to load (workflow routing)

                - Vague topic, scoping a new study, or converging on a question → `research-scoping`
                - Needs literature support, or "has anyone already done this" → `literature-recon`
                - A claim is about to drive work or leave the room, or two routes conflict and need a real challenge → `redteam-ruling` (the red team must run as an independent subagent)
                - Wrapping up a work round, ending a session, handing off, or resuming → `progress-sync`
                - Needs bibliographic metadata (DOI, venue, citation counts, reference lists) rather than full text → `metadata-query`
                - A method-heavy paper has been chosen for study and its derivations must be understood durably, or an existing section note's formulas are unreadable → `section-notes`
                - A paper has been read and the study will build on it, code is about to be written from its equations, or existing code cites one → `adoption-ruling`
                - Work is about to be handed to a subagent (an explorer, or an implementer who writes or runs code) → `subagent-contract`
                - Code is about to run to test a hypothesis, or a run's outcome is being reported → `experiment-protocol`
                - Exploration produced several directions and one must be committed to, or the user asks "so what do we do now" → `synthesis-plan`

                These skills are **hard rules**, not suggestions: when a trigger condition is met, load the skill and follow it.

                A skill that appears in this session's catalog but not in the list above belongs to the profile, not to this workbench. Loading one is allowed, but say in one line what it is for; do not treat a foreign discipline as this preset's method.
              # No `suffix:` - the kernel registers no `cwd` prompt variable from 0.2.1 on, and an
              # unregistered name throws during prompt assembly (see the header note and #47).

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ──────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ─────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills（本预设的纪律载体，必须挂载）─────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ──────────────────────────────────────────────────────────

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ──────────────────────────────────────────────────────

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ─────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation（红队子代理 / 并行研究 / 工作流）─────────────────────

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          # ── remaining model-facing rows ────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── no MCP server is mounted（两个外部通道都是自带 CLI helper）──────────
          # Both academic rows are gone on purpose. `mcp-arxiv` cost 17,828 characters (~4.95k tokens)
          # of prompt on EVERY request for 19 tools; `mcp-zotero`, with its optional tool groups
          # already off, cost 59,758 (~16.6k) for 35. Together 21,551 tokens per request, for a
          # handful of tools the disciplines actually call. The surface could not be trimmed - the MCP
          # client's Config is a closed field list with no include/exclude, and `syncTools` registers
          # every tool a server lists - so the only lever was not mounting the row.
          #
          # The channels are now tools/arxiv.mjs and tools/zotero-read.mjs / -write.mjs / -note.mjs /
          # -edit.mjs / -collection.mjs / -link-attachments.mjs: zero resident cost, one change per
          # invocation, and a dry run unless --write is given. Reference-library writes are gated by
          # the owner in the reference manager, once per library rather than once per write
          # (protocol.md Revision 10); how a write may be authorized is stated by autoresearch-contact.
          #
          # Do NOT add either row back: tools/preset-selftest.mjs fails when one reappears. See #29
          # (preprint) and #31 (reference library) of docs/01_decisions.md for the measurements.

          # ── tool isolation（屏蔽 profile 级的其它 global 工具）──────────────

          - id: autoresearch-isolation
            name: '@beibingyangliuying/dsh-autoresearch-preset/isolation.js'

          # ── configurable values → system prompt（empty config registers nothing）──

          - id: autoresearch-contact
            name: '@beibingyangliuying/dsh-autoresearch-preset/contact-bridge.js'

          # ── ship the disciplines inside the preset (visible only to this preset) ──

          - id: autoresearch-skills
            name: '@beibingyangliuying/dsh-autoresearch-preset/skills.js'
# ── the bundle's own host row: carries the client half (the settings page) ──
# A bundle patch is a list of id-targeted patches, so a NEW row needs insert: - a bare id is
# read as an override and skipped with 'entry ... not found'.

- insert:
    - id: autoresearch-bundle
      name: '@beibingyangliuying/dsh-autoresearch-preset'
