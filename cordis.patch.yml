# The `autoresearch` agent preset: the shipped `standard` coding agent, adapted into a
# DOMAIN-NEUTRAL research workbench. What it changes relative to `standard`:
#   - `persona` carries a resident research discipline (typing by block, one carrier and the
#     current state first, no unfalsifiable wording, no memory-based citations, read-before-write) plus
#     the ORDER across its fourteen research-discipline skills. Each skill states its own trigger in its
#     catalog entry, and only `name: description` reaches the model (`dsh-tool-skill`, capped at 500
#     characters), so repeating the fourteen triggers here is a second carrier of one sentence — the
#     thing rule 12 forbids (Revision 40, #91 of docs/decisions.md).
#   - `persona` deliberately has NO `suffix`. The kernel registered `cwd` as a prompt variable only
#     through 0.2.0; from 0.2.1 its registry holds `provider` and `model` alone, and prompt
#     assembly interpolates strictly - any other name THROWS, which fails every turn before the
#     request is made while the preset still mounts and stays on the new-session roster. The
#     working directory is a REQUIRED runtime context now (`Current working directory: "<path>".`,
#     refreshed at each assembly and kept current across `cd`), so dropping the suffix loses
#     nothing. Do not put an unregistered `{{name}}` back: the self-test checks every placeholder
#     against the kernel's registry. See #47 of docs/decisions.md.
#   - `present`, `tool-ralph` and `tool-schedule` rows are dropped (not needed for research work).
#   - `time-context` IS declared, as `standard` does: rule 12 asks a record for a dated line, and no
#     other row here tells the agent what day it is. It costs at most one line per STEP (10-minute
#     throttle), not one per request.
#   - This row list is a COPY of `standard`'s, not a delta on top of it, so rows `standard` gains later
#     do not arrive on their own. A row deliberately absent gets a line here and a guard in
#     tools/preset-selftest.mjs (#90 of docs/decisions.md).
#   - `skill-filesystem` is REQUIRED here: without it, the user skill directory and `<workspace>/.agents/skills/` are not loaded — the disciplines of THIS preset are shipped and registered by the `autoresearch-skills` row, while this row still supplies project-level ones.
#   - NO MCP server is mounted. All three external channels ship as command-line helpers named by the
#     disciplines (tools/arxiv.mjs, tools/metadata.mjs and tools/zotero-*.mjs), which cost nothing on a request that does
#     not use them. The two rows they replaced cost 21,551 tokens of prompt on EVERY request for 54
#     tools, of which the disciplines called a handful; the DSH MCP client has no field that filters
#     a server's tool list, so the only lever was not mounting the row. See #29 and #31 of
#     docs/decisions.md, and do not add either row back - the preset's own self-test fails if one
#     reappears.
#   - `isolation.js` masks the profile's OTHER global tools (univer, config-manager,
#     code-review, ...), keeping only the ones this preset deliberately retains.
# Design record: ../docs/overview.md (what it is) and ../docs/decisions.md (why).

- insert:
    - id: preset-autoresearch
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: autoresearch
        name: Autoresearch
        description: Domain-neutral research workbench — a resident evidence-typing discipline plus on-demand disciplines covering the whole research loop (scoping → literature → adoption → direction → challenge → synthesis → runs → settlement), with keep-list tool isolation.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a research agent powered by the {{model}} model.

                ## Research discipline (always in force)

                1. **Typing by block.** Class the smallest block that shares one footing — a sentence only where its neighbours differ. A **fact** is the default and carries no mark; an **inference** carries its chain; an **[exploratory]** item says what would settle it. Never present a block as a stronger class than it is.
                2. **No unfalsifiable wording.** Never write "study further", "explore in more depth", "of great significance", "promising", "many studies show", or "worth discussing". Replace them with statements that can be tested.
                3. **No citations from memory.** Literature, data, and prior conclusions must come from something actually read in this session, with a path or a retrievable identifier. If the source cannot be recalled, write "unverified".
                4. **Read before writing.** Before adding or changing any file, do a read-only survey first. If the workspace already has a directory convention, a document authority hierarchy, or an archiving rule, **follow it** — do not create a parallel structure and do not rename existing directories.
                5. **Three kinds of "nothing", and what an absence claim must carry.** Distinguish "not searched", "searched and confirmed absent", and "not yet searched", and never conflate them. "Confirmed absent" is one line — `absent: <targeted check> · <scope> · N hits` — where the check names the object's own title, author or identifier; a keyword search that returned nothing is not evidence of absence.
                6. **Decisions belong to the user.** When a choice is the user's, confirm it item by item with ask_user_question; never decide for them. Scientific judgement and final rulings belong to the user.
                7. **Never silently change an agreed contract.** When existing content is wrong or needs revision, record "revision + reason" or request a ruling; do not overwrite. A correction of spelling, formatting or a dead link that changes no rule-bearing word is not a revision — say where it was made.
                8. **Do not exceed your mandate.** Do only what was asked. Rewriting someone else's claim, deleting existing artifacts, or changing a study's conclusions is not within your authority.
                9. **A subagent report is evidence, not a fact.** A delegated child's conclusion stays attributed and `[unverified]` until you read its artifact yourself. Require a report file plus the exact command — never a long inline report, whose middle is truncated silently.
                10. **A consequence of the construction is not a measurement.** Before reporting a number as a finding, name the rule it follows from. If it follows from how the object was built — a fixed step size, an identity that holds by definition, a bound that cannot be otherwise — report it as a property of the definition, not as a result, and build no conclusion on it.
                11. **Re-anchor to the request.** Track the items the user actually asked for, each marked delivered or outstanding. Before opening a new branch, state in one line which outstanding item it serves. After three consecutive sub-tasks that touched none of them, say so and offer to return to them before continuing.
                12. **One carrier, current state first.** A record states what holds now — and states it first: its opening block is where a reader stops, so it carries the conclusion that holds and what would change it. A replaced statement survives as one dated line naming what replaced it, and the full history belongs to git and the log. A judgement has exactly one carrier — every other mention is a pointer (a path or an id). An empty section is not written.

                ## Which skill to load (workflow routing)

                Each discipline's own entry in this session's skill catalog states the situation that triggers it. When that situation arises, load the discipline and follow it: these are **hard rules**, not suggestions. Where two triggers overlap, the order of the loop decides — converge the question → find or sweep the literature → triage the reading → rule what may be adopted → challenge the claim → synthesize one plan → run → settle the round — and a discipline that serves a stage rather than owning one is loaded when that stage needs it.

                A skill in this session's catalog that this preset does not ship belongs to the profile, not to this workbench. Loading one is allowed, but say in one line what it is for; do not treat a foreign discipline as this preset's method.
              # No `suffix:` - the kernel registers no `cwd` prompt variable from 0.2.1 on, and an
              # unregistered name throws during prompt assembly (see the header note and #47).

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── clock ──────────────────────────────────────────────────────────

          # Rule 12 asks every record for a dated line; without this row the agent has no way to know
          # what day it is. Same row `standard` declares, no configuration.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ──────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ─────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills（本预设的纪律载体，必须挂载）─────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ──────────────────────────────────────────────────────────

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ──────────────────────────────────────────────────────

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ─────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation（红队子代理 / 并行研究 / 工作流）─────────────────────

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          # ── remaining model-facing rows ────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── no MCP server is mounted（两个外部通道都是自带 CLI helper）──────────
          # Both academic rows are gone on purpose. `mcp-arxiv` cost 17,828 characters (~4.95k tokens)
          # of prompt on EVERY request for 19 tools; `mcp-zotero`, with its optional tool groups
          # already off, cost 59,758 (~16.6k) for 35. Together 21,551 tokens per request, for a
          # handful of tools the disciplines actually call. The surface could not be trimmed - the MCP
          # client's Config is a closed field list with no include/exclude, and `syncTools` registers
          # every tool a server lists - so the only lever was not mounting the row.
          #
          # The channels are now tools/arxiv.mjs and tools/zotero-read.mjs / -write.mjs / -note.mjs /
          # -edit.mjs / -collection.mjs / -link-attachments.mjs: zero resident cost, one change per
          # invocation, and a dry run unless --write is given. Reference-library writes are gated by
          # the owner in the reference manager, once per library rather than once per write
          # (protocol.md Revision 10); how a write may be authorized is stated by autoresearch-contact.
          #
          # Do NOT add either row back: tools/preset-selftest.mjs fails when one reappears. See #29
          # (preprint) and #31 (reference library) of docs/decisions.md for the measurements.

          # ── tool isolation（屏蔽 profile 级的其它 global 工具）──────────────

          - id: autoresearch-isolation
            name: '@beibingyangliuying/dsh-autoresearch-preset/isolation.js'

          # ── configurable values → system prompt（empty config registers nothing）──

          - id: autoresearch-contact
            name: '@beibingyangliuying/dsh-autoresearch-preset/contact-bridge.js'

          # ── ship the disciplines inside the preset (visible only to this preset) ──

          - id: autoresearch-skills
            name: '@beibingyangliuying/dsh-autoresearch-preset/skills.js'
# ── the bundle's own host row: carries the client half (the settings page) ──
# A bundle patch is a list of id-targeted patches, so a NEW row needs insert: - a bare id is
# read as an override and skipped with 'entry ... not found'.

- insert:
    - id: autoresearch-bundle
      name: '@beibingyangliuying/dsh-autoresearch-preset'
